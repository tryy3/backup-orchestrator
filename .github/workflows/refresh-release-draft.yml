name: Refresh Release Draft

# Regenerates the draft release body from PR release-note blocks after
# Release Drafter updates the rolling draft. For AI-polished release notes
# when preparing to publish, use the enrich-release-notes skill locally.

on:
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: >
          Optional explicit draft release ID. Preferred when GitHub exposes the
          draft as untagged-* and tag-based lookup is unreliable.
        required: false
        default: ''
      draft_tag:
        description: >
          Optional explicit draft version or tag (for example v0.4.0 or
          untagged-*). Use when auto-detection should not pick the latest draft.
        required: false
        default: ''
      from_tag:
        description: >
          Collect PRs merged after this tag. Leave blank to auto-detect
          the last published tag.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  refresh-draft:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FROM_TAG="${{ inputs.from_tag }}"
          if [ -n "$FROM_TAG" ]; then
            python3 scripts/release-notes.py --from-tag "$FROM_TAG" --output notes.md
          else
            python3 scripts/release-notes.py --output notes.md
          fi
          echo "--- Structured notes ---"
          cat notes.md

      - name: Resolve draft release
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$RELEASE_ID" ]; then
            ARGS+=(--release-id "$RELEASE_ID")
          elif [ -n "$DRAFT_TAG" ]; then
            ARGS+=(--version "$DRAFT_TAG")
          fi
          python3 scripts/draft_release.py "${ARGS[@]}" --json > draft.json
          echo "tag=$(jq -r .tag_name draft.json)" >> "$GITHUB_OUTPUT"
          echo "effective_version=$(jq -r .effective_version draft.json)" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r .id draft.json)" >> "$GITHUB_OUTPUT"
          jq . draft.json

      - name: Update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating draft release ${{ steps.draft.outputs.effective_version }} (tag: ${{ steps.draft.outputs.tag }}, id: ${{ steps.draft.outputs.release_id }})"
          gh release edit "${{ steps.draft.outputs.tag }}" --notes-file notes.md
          echo "Done. Open Releases to review: https://github.com/${{ github.repository }}/releases"
